# Node comes from common-ci-configuration: its node-test-tools image carries the
# Node version ccc's docker-bake.hcl sets (NODE_VERSION), so this file pins none.
include:
  - project: "hive/common-ci-configuration"
    ref: develop
    file:
      - "/templates/base.gitlab-ci.yml"
      - "/templates/npm_projects.gitlab-ci.yml"

image: "${NODE_TEST_TOOLS_IMAGE}"

stages:
  - .pre
  - build
  - test
  - deploy

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  # Track ccc develop (`branch = develop` in .gitmodules) so a catalog bump there
  # reaches this repo's next pipeline.
  GIT_SUBMODULE_UPDATE_FLAGS: --remote

# Branch pipelines, except for AIDEV-driven development: ai/<issue>-...,
# session/<name> and aidev/integration are verified by the suites in
# .aidev/project.yaml, not by CI. A push to aidev/integration runs no pipeline;
# one started by hand or through the API does (`glab ci run -b aidev/integration`),
# which is how its MR into main gets a pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(ai|session)\//
      when: never
    - if: $CI_COMMIT_BRANCH == "aidev/integration" && $CI_PIPELINE_SOURCE !~ /^(web|api)$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - node_modules/
    - .pnpm-store/

default:
  tags:
    - public-runner-docker

.npm_based_job:
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.0 --activate
    - pnpm config set store-dir .pnpm-store
    - git submodule status --recursive # which ccc catalog this job installs against
    # Frozen install; after a ccc catalog bump it reinstalls unfrozen and keeps the
    # refreshed lockfile as the pnpm-lock.catalog-refreshed.yaml artifact to commit.
    # Only the install ignores scripts (no lifecycle postinstall scripts): the
    # jobs' own `pnpm build` must still run `prebuild`.
    - export npm_config_ignore_scripts=true
    - !reference [.pnpm_install_with_catalog_fallback, script]
    - unset npm_config_ignore_scripts
  artifacts:
    paths:
      - pnpm-lock.catalog-refreshed.yaml
    when: always
    expire_in: 1 week

lint:
  extends: .npm_based_job
  stage: .pre
  script:
    - pnpm lint

build:
  extends: .npm_based_job
  stage: build
  script:
    - pnpm build
    - pnpm pack
  artifacts:
    paths:
      - hiveio-metamask-snap-*.tgz
      - snapper*.log.json
      - dist/bundle.js # For tests
      - snap.manifest.json
      - pnpm-lock.catalog-refreshed.yaml
    when: always
    expire_in: 1 week

reproducible_build:
  extends: .npm_based_job
  stage: build
  variables:
    # The script installs into two temporary checkouts; point them at the cached store.
    npm_config_store_dir: "${CI_PROJECT_DIR}/.pnpm-store"
  script:
    - ./scripts/check-reproducible-build.sh

test:
  extends: .npm_based_job
  stage: test
  script:
    - pnpm test
  needs:
    - job: build
      artifacts: true
  artifacts:
    reports:
      junit: junit.xml
    when: always
    expire_in: 1 week

publish_dev_package:
  extends: .npm_based_job
  stage: deploy
  only:
    refs:
      - main
  variables:
    REGISTRY_URL: "gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
    PUBLISH_TOKEN: "${CI_JOB_TOKEN}"
  script:
    - echo "@hiveio:registry=https://${REGISTRY_URL}" > .npmrc
    - echo "//${REGISTRY_URL}:_authToken=\"${PUBLISH_TOKEN}\"" >> .npmrc
    - pnpm publish --no-git-checks --access=public hiveio-metamask-snap-*.tgz
  needs:
    - job: test
    - job: build
      artifacts: true

publish_npmjs_package:
  extends: .npm_based_job
  stage: deploy
  only:
    refs:
      - main
  variables:
    REGISTRY_URL: "registry.npmjs.org/"
    PUBLISH_TOKEN: "${INTERNAL_HIDDEN_PUBLISH_TOKEN}"
  script:
    - echo "@hiveio:registry=https://${REGISTRY_URL}" > .npmrc
    - echo "//${REGISTRY_URL}:_authToken=\"${PUBLISH_TOKEN}\"" >> .npmrc
    - pnpm publish --no-git-checks --access=public hiveio-metamask-snap-*.tgz
  needs:
    - job: test
    - job: build
      artifacts: true
